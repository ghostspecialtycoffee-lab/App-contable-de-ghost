name: Deploy Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Respaldo automático: publica main si hubo merges que no dispararon Actions
    - cron: "*/20 * * * *"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD

      - name: Skip if main already deployed (scheduled only)
        if: github.event_name == 'schedule'
        id: deploy_gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT=$(git rev-parse HEAD)
          LAST=$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-firebase.yml/runs?status=success&branch=main&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true
          )
          if [ -n "$LAST" ] && [ "$CURRENT" = "$LAST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en main ($CURRENT). Omitiendo deploy programado."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Deploy programado: ${LAST:-ninguno} -> $CURRENT"
          fi

      - name: Setup pnpm
        if: steps.deploy_gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
          node --version
          pnpm --version

      - name: Install dependencies
        if: steps.deploy_gate.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.deploy_gate.outputs.skip != 'true'
        run: pnpm test

      - name: Build
        if: steps.deploy_gate.outputs.skip != 'true'
        run: pnpm build

      - name: Deploy to Firebase
        if: steps.deploy_gate.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -uo pipefail
          FB=(npx firebase-tools@13 deploy --project ghost-contable --non-interactive)
          HOSTING_OK=0
          BACKEND_OK=0

          setup_auth() {
            if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
              echo "Auth: FIREBASE_SERVICE_ACCOUNT (JSON)"
              CREDS="${RUNNER_TEMP}/firebase-sa.json"
              printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDS"
              export GOOGLE_APPLICATION_CREDENTIALS="$CREDS"
            elif [ -n "${FIREBASE_TOKEN:-}" ]; then
              if printf '%s' "$FIREBASE_TOKEN" | grep -q '"type"[[:space:]]*:[[:space:]]*"service_account"'; then
                echo "::error title=Secret mal nombrado::Pegaste el JSON en FIREBASE_TOKEN. Usa FIREBASE_SERVICE_ACCOUNT."
                exit 1
              fi
              echo "Auth: FIREBASE_TOKEN"
              FB+=(--token "$FIREBASE_TOKEN")
            else
              echo "::error title=Secret faltante::Agrega FIREBASE_SERVICE_ACCOUNT o FIREBASE_TOKEN."
              exit 1
            fi
          }

          setup_auth

          echo "=== 0/4 Firestore rules (funciona en plan Spark) ==="
          if ! "${FB[@]}" --only firestore:rules; then
            echo "::error::No se pudieron publicar reglas Firestore. Crea Firestore en Firebase Console."
            exit 1
          fi
          echo "=== 0b/4 Firestore indexes (opcional) ==="
          "${FB[@]}" --only firestore:indexes || echo "::warning::Índices omitidos — crea Firestore si falta"

          echo "=== 1/4 Hosting (app web) ==="
          if "${FB[@]}" --only hosting; then
            HOSTING_OK=1
            echo "✅ https://ghost-contable.web.app"
          else
            echo "::error::Falló deploy de hosting"
            exit 1
          fi

          echo "=== 2/4 Firestore + Functions (requiere Blaze) ==="
          if "${FB[@]}" --only firestore:rules,firestore:indexes,functions; then
            BACKEND_OK=1
            echo "✅ Backend desplegado (registro/onboarding listo)"
          else
            echo "::warning::Firestore/Functions no desplegados. Verifica plan Blaze:"
            echo "https://console.firebase.google.com/project/ghost-contable/usage/details"
          fi

          echo "=== 3/4 Storage (opcional) ==="
          if "${FB[@]}" --only storage; then
            echo "✅ Storage desplegado"
          else
            echo "::warning::Storage omitido. Actívalo en Firebase Console:"
            echo "https://console.firebase.google.com/project/ghost-contable/storage"
          fi

          if [ "$HOSTING_OK" -eq 1 ]; then
            echo "Deploy completado: app web publicada."
            exit 0
          fi
          exit 1

  bootstrap-import:
    needs: deploy
    runs-on: ubuntu-latest
    if: needs.deploy.result == 'success'
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD

      - name: Setup pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.6.5 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap import if database empty
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GOOGLE_CLOUD_PROJECT: ghost-contable
        run: |
          set -euo pipefail

          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            CREDS="${RUNNER_TEMP}/firebase-sa.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDS"
            export GOOGLE_APPLICATION_CREDENTIALS="$CREDS"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "::error::Configura FIREBASE_SERVICE_ACCOUNT (JSON) para import admin."
            exit 1
          else
            echo "::warning::Sin FIREBASE_SERVICE_ACCOUNT — import automático omitido."
            exit 0
          fi

          node scripts/import-initial-purchases.mjs \
            --auto --bootstrap --confirm --skip-if-populated

          node scripts/seed-ghost-menu.mjs \
            --auto --confirm --skip-if-seeded || echo "::warning::Seed carta Ghost omitido o falló"

          node scripts/apply-menu-prices-and-cost-matrix.mjs \
            --auto --confirm || echo "::warning::Precios/matríz de costos omitido o falló"

          node scripts/sync-table-qr-lookups.mjs \
            --auto --confirm || echo "::warning::Sync QR mesas omitido o falló"
