name: Deploy Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Deploy to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          FB=(npx firebase-tools@13 deploy --project ghost-contable --non-interactive)

          deploy_phased() {
            echo "=== 1/3 Hosting (app web) ==="
            "${FB[@]}" --only hosting
            echo "=== 2/3 Firestore + Functions ==="
            if ! "${FB[@]}" --only firestore:rules,firestore:indexes,functions; then
              echo "::warning::Backend parcial — agrega rol Firebase Admin al service account"
            fi
            echo "=== 3/3 Storage (opcional) ==="
            "${FB[@]}" --only storage || echo "::warning::Storage omitido — agrega rol Storage Admin al service account"
            echo "=== Hosting publicado en https://ghost-contable.web.app ==="
          }

          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "Deploy con FIREBASE_SERVICE_ACCOUNT (JSON)..."
            CREDS="${RUNNER_TEMP}/firebase-sa.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDS"
            export GOOGLE_APPLICATION_CREDENTIALS="$CREDS"
            deploy_phased
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            if printf '%s' "$FIREBASE_TOKEN" | grep -q '"type"[[:space:]]*:[[:space:]]*"service_account"'; then
              echo "::error title=Secret mal nombrado::Pegaste el JSON en FIREBASE_TOKEN. Créalo como FIREBASE_SERVICE_ACCOUNT."
              exit 1
            fi
            echo "Deploy con FIREBASE_TOKEN..."
            FB+=(--token "$FIREBASE_TOKEN")
            deploy_phased
          else
            echo "::error title=Secret faltante::Agrega FIREBASE_SERVICE_ACCOUNT (JSON) o FIREBASE_TOKEN en GitHub Secrets."
            echo "Guía: docs/ACTIVAR.md"
            exit 1
          fi
